<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小小收銀員 🛒</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- ?v= 版本號:強制瀏覽器/CDN 重抓,改了 config.js 才會立刻生效 -->
<script src="config.js?v=2"></script>
<style>
  :root{
    --pink:#F7B7CF;
    --pink-deep:#EE8FB6;
    --cream:#FFF9F2;
    --green:#6FBF4A;
    --ink:#443344;
    --yellow:#FFD666;
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    display:flex;flex-direction:column;
    overflow:hidden;
    user-select:none;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(var(--pink) 1.5px, transparent 1.5px);
    background-size:26px 26px;opacity:.25;
  }

  header{
    padding:14px 18px 10px;
    display:flex;align-items:center;justify-content:space-between;
    position:relative;z-index:2;
  }
  header h1{font-size:22px;letter-spacing:2px;}
  header h1 .emoji{font-size:26px;}
  .cart-pill{
    background:var(--white);border:3px solid var(--ink);border-radius:999px;
    padding:6px 14px;font-weight:800;font-size:16px;
    box-shadow:3px 3px 0 var(--pink-deep);
    display:flex;align-items:center;gap:6px;
  }
  .cart-pill.bump{animation:bump .4s ease;}
  @keyframes bump{30%{transform:scale(1.25) rotate(-6deg);}}

  main{flex:1;display:flex;flex-direction:column;position:relative;z-index:1;padding:0 16px 16px;min-height:0;}

  .screen{display:none;flex:1;flex-direction:column;min-height:0;}
  .screen.active{display:flex;}

  #startScreen{align-items:center;justify-content:center;text-align:center;gap:18px;}
  .big-card{
    background:var(--pink);border:4px solid var(--ink);border-radius:24px;
    width:180px;padding:22px 16px 16px;
    box-shadow:6px 6px 0 var(--ink);
    transform:rotate(-3deg);
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{50%{transform:rotate(-3deg) translateY(-8px);}}
  .big-card .veg{font-size:72px;line-height:1;}
  .big-card .veg-name{margin-top:10px;font-weight:900;font-size:20px;letter-spacing:4px;}
  .big-card .bars{margin-top:12px;background:var(--white);border-radius:8px;padding:6px 8px;
    background-image:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px);
    background-clip:content-box;height:34px;}
  #startScreen p{font-size:16px;line-height:1.7;max-width:280px;}
  .db-badge{font-size:12px;font-weight:700;color:#A89;}
  .db-badge.ok{color:var(--green);}
  .btn{
    border:4px solid var(--ink);border-radius:999px;
    font-family:inherit;font-weight:900;font-size:20px;letter-spacing:2px;
    padding:14px 34px;cursor:pointer;color:var(--ink);
    box-shadow:0 5px 0 var(--ink);
    transition:transform .1s, box-shadow .1s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
  .btn-green{background:var(--green);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2);}
  .btn-yellow{background:var(--yellow);}
  .btn-pink{background:var(--pink);}
  .btn-ghost{background:var(--white);}

  #scanScreen{gap:12px;}
  .camera-frame{
    position:relative;flex:1;min-height:0;
    border:4px solid var(--ink);border-radius:24px;overflow:hidden;
    background:#222;box-shadow:6px 6px 0 var(--pink-deep);
  }
  #reader{width:100%;height:100%;}
  #reader video{width:100%!important;height:100%!important;object-fit:cover;}
  .scan-line{
    position:absolute;left:10%;right:10%;height:4px;border-radius:4px;
    background:var(--yellow);box-shadow:0 0 12px var(--yellow);
    animation:scanline 1.6s ease-in-out infinite;pointer-events:none;z-index:5;
  }
  @keyframes scanline{0%,100%{top:20%;}50%{top:75%;}}
  .hint{
    text-align:center;font-size:15px;font-weight:700;color:var(--ink);
    background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:8px;
  }
  .manual-link{
    align-self:center;background:none;border:none;font-family:inherit;
    font-size:14px;font-weight:700;color:var(--pink-deep);
    text-decoration:underline;cursor:pointer;padding:2px 8px;
  }
  .scan-actions{display:flex;gap:10px;}
  .scan-actions .btn{flex:1;font-size:16px;padding:12px 8px;}

  #resultOverlay{
    position:fixed;inset:0;background:rgba(255,249,242,.96);z-index:50;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;
  }
  #resultOverlay.show{display:flex;}
  .result-card{
    background:var(--pink);border:5px solid var(--ink);border-radius:28px;
    width:min(240px,70vw);padding:28px 20px 20px;text-align:center;
    box-shadow:8px 8px 0 var(--ink);
    animation:pop .45s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
  .result-card .veg{font-size:96px;line-height:1;animation:wiggle 1s ease .3s;}
  @keyframes wiggle{25%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}75%{transform:rotate(-4deg);}}
  .result-card .veg-name{margin-top:12px;font-weight:900;font-size:28px;letter-spacing:6px;}
  .result-card .veg-en{
    margin-top:6px;font-weight:800;font-size:19px;letter-spacing:1px;
    color:#fff;text-shadow:0 2px 0 var(--pink-deep);
    animation:pop .5s .25s both;
  }
  .praise{font-size:22px;font-weight:900;color:var(--pink-deep);animation:pop .5s .15s both;}

  #newCardForm{
    background:var(--white);border:4px solid var(--ink);border-radius:24px;
    padding:20px;width:min(340px,88vw);box-shadow:6px 6px 0 var(--ink);
    display:flex;flex-direction:column;gap:14px;
  }
  #newCardForm h3{font-size:18px;text-align:center;}
  #newCardForm .code{font-size:12px;color:#997;text-align:center;font-family:monospace;}
  #newCardForm input{
    border:3px solid var(--ink);border-radius:12px;padding:12px;font-size:18px;
    font-family:inherit;width:100%;text-align:center;
  }
  .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .emoji-grid button{
    font-size:26px;background:var(--cream);border:2px solid transparent;border-radius:10px;
    padding:6px 0;cursor:pointer;
  }
  .emoji-grid button.sel{border-color:var(--ink);background:var(--yellow);}

  #checkoutScreen{align-items:center;justify-content:center;gap:16px;text-align:center;}
  #checkoutScreen h2{font-size:26px;letter-spacing:3px;}
  .receipt{
    background:var(--white);border:4px solid var(--ink);border-radius:18px;
    width:min(320px,86vw);max-height:44vh;overflow:auto;padding:16px;
    box-shadow:6px 6px 0 var(--pink-deep);
  }
  .receipt .row{display:flex;justify-content:space-between;align-items:center;
    font-size:20px;font-weight:800;padding:8px 4px;border-bottom:2px dashed #EBD;}
  .receipt .row:last-child{border-bottom:none;}
  .receipt .row .n{color:var(--pink-deep);}
  .stars{font-size:34px;letter-spacing:6px;animation:pop .6s both;}

  .confetti{position:fixed;top:-20px;font-size:24px;z-index:60;pointer-events:none;
    animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;
    font-size:14px;font-weight:700;z-index:70;opacity:0;transition:opacity .3s;
    max-width:86vw;text-align:center;
  }
  .toast.show{opacity:1;}

  /* 設定 chip(音效/語音) */
  .settings-row{display:flex;gap:10px;margin-top:4px;}
  .chip{
    font-family:inherit;font-weight:800;font-size:14px;
    background:var(--white);border:3px solid var(--ink);border-radius:999px;
    padding:8px 16px;cursor:pointer;color:var(--ink);
    box-shadow:2px 2px 0 var(--ink);
  }
  .chip.off{opacity:.45;text-decoration:line-through;box-shadow:none;}

  /* 手電筒亮起 */
  #torchBtn{flex:0 0 auto;padding:12px 14px;}
  #torchBtn.on{background:var(--yellow);box-shadow:0 5px 0 var(--ink),0 0 16px var(--yellow);}

  /* 收據價格 */
  .receipt .row small{font-weight:700;color:#B9A;font-size:14px;}
  .receipt .row em{font-style:normal;font-weight:700;color:var(--pink-deep);font-size:14px;}
  .receipt .row.total-row{border-top:3px solid var(--ink);border-bottom:none;
    margin-top:4px;padding-top:10px;font-size:22px;}
  .receipt .row.total-row .n{color:var(--green);}

  /* 付錢畫面 */
  #payScreen{align-items:center;justify-content:center;gap:12px;text-align:center;}
  .pay-total{font-size:22px;font-weight:800;}
  .pay-total b{color:var(--pink-deep);font-size:28px;}
  .pay-paid{font-size:18px;font-weight:800;color:var(--green);}
  .pay-hint{font-size:15px;font-weight:700;color:var(--ink);
    background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;}
  .money-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    width:min(340px,88vw);}
  .money-btn{
    font-family:inherit;font-weight:900;font-size:22px;color:var(--ink);
    background:var(--yellow);border:4px solid var(--ink);border-radius:16px;
    padding:18px 0;cursor:pointer;box-shadow:0 5px 0 var(--ink);
    transition:transform .1s, box-shadow .1s;
  }
  .money-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
  .btn.dim{opacity:.4;box-shadow:0 5px 0 var(--ink);cursor:not-allowed;}

  /* 籃子 overlay */
  #cartOverlay{
    position:fixed;inset:0;background:rgba(68,51,68,.55);z-index:55;
    display:none;align-items:flex-end;justify-content:center;
  }
  #cartOverlay.show{display:flex;}
  .cart-panel{
    background:var(--cream);border:4px solid var(--ink);
    border-radius:24px 24px 0 0;width:min(440px,100%);
    padding:20px 18px 24px;box-shadow:0 -6px 0 var(--pink-deep);
    max-height:80vh;display:flex;flex-direction:column;gap:12px;
    animation:slideUp .3s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .cart-panel h3{font-size:20px;text-align:center;letter-spacing:2px;}
  .cart-list{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:60px;}
  .cart-item{
    display:flex;align-items:center;gap:8px;
    background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;
  }
  .cart-item .ci-name{flex:1;font-weight:800;font-size:17px;}
  .cart-item .ci-mid{font-weight:700;font-size:14px;color:#B9A;}
  .ci-remove{
    font-size:18px;background:var(--pink);border:3px solid var(--ink);border-radius:10px;
    width:38px;height:38px;cursor:pointer;flex:0 0 auto;box-shadow:2px 2px 0 var(--ink);
  }
  .ci-remove:active{transform:translateY(2px);box-shadow:none;}
  .cart-empty{text-align:center;color:#A89;font-weight:700;padding:20px;line-height:1.8;}
  .cart-foot{display:flex;align-items:center;justify-content:space-between;
    font-size:20px;font-weight:900;padding-top:6px;border-top:3px dashed #EBD;}

  /* ---- 模式選單 ---- */
  .mode-list{display:flex;flex-direction:column;gap:10px;width:min(260px,80vw);}
  .mode-list .btn{font-size:19px;padding:13px 20px;width:100%;}

  /* ---- 任務面板(購物單 / 英文題目) ---- */
  .task-panel{
    background:var(--white);border:4px solid var(--ink);border-radius:18px;
    padding:10px 14px;box-shadow:4px 4px 0 var(--pink-deep);
    display:flex;flex-direction:column;gap:6px;flex:0 0 auto;
  }
  .task-title{font-size:15px;font-weight:900;letter-spacing:1px;text-align:center;}
  .goal{display:flex;align-items:center;justify-content:space-between;
    font-size:17px;font-weight:800;padding:2px 4px;}
  .goal.ok{color:var(--green);}
  .goal .g-dots{letter-spacing:2px;font-size:15px;}
  .quiz-word{
    text-align:center;font-size:26px;font-weight:900;letter-spacing:2px;
    color:var(--pink-deep);min-height:34px;transition:filter .2s;
  }
  .quiz-word.hidden{filter:blur(11px);}
  .quiz-btns{display:flex;gap:8px;justify-content:center;}
  .quiz-btns .btn{font-size:15px;padding:8px 16px;}
  .quiz-score{font-size:34px;font-weight:900;color:var(--pink-deep);letter-spacing:3px;}

  /* 掃到卡片時的任務提示 */
  .hit-tag{
    background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:999px;
    padding:7px 18px;font-weight:900;font-size:16px;box-shadow:3px 3px 0 var(--ink);
    animation:pop .4s .1s both;
  }
  .hit-tag.off{background:var(--white);color:#A89;font-size:14px;}

  /* ---- 圖鑑 ---- */
  #collectionScreen{gap:10px;}
  .coll-head{flex:0 0 auto;text-align:center;}
  .coll-head h2{font-size:22px;letter-spacing:2px;}
  .coll-prog{font-size:14px;font-weight:800;color:var(--pink-deep);margin-top:2px;}
  .coll-track{height:14px;background:var(--white);border:3px solid var(--ink);
    border-radius:999px;overflow:hidden;margin-top:6px;}
  .coll-bar{height:100%;background:var(--green);width:0;transition:width .5s ease;}
  .coll-body{flex:1;overflow:auto;min-height:0;padding-bottom:6px;}
  .coll-cat{font-size:16px;font-weight:900;letter-spacing:2px;margin:12px 0 6px;}
  .coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;}
  .coll-card{
    background:var(--pink);border:3px solid var(--ink);border-radius:14px;
    padding:8px 4px 6px;text-align:center;box-shadow:2px 2px 0 var(--ink);cursor:pointer;
  }
  .coll-card:active{transform:translateY(2px);box-shadow:none;}
  .coll-card.locked{background:#EFE7EC;box-shadow:none;opacity:.65;cursor:default;}
  .coll-card.locked .cc-emoji{filter:grayscale(1);opacity:.5;}
  .cc-emoji{font-size:30px;line-height:1.1;}
  .cc-name{font-size:13px;font-weight:800;margin-top:2px;}
  .cc-en{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 0 var(--pink-deep);}
</style>
</head>
<body>
<header>
  <h1><span class="emoji">🛒</span> 小小收銀員</h1>
  <div class="cart-pill" id="cartPill">🧺 <span id="cartCount">0</span></div>
</header>

<main>
  <!-- START -->
  <section class="screen active" id="startScreen">
    <div class="big-card">
      <div class="veg">🥬</div>
      <div class="veg-name">高麗菜</div>
      <div class="bars"></div>
    </div>
    <p>拿起你的小卡片，<br>對準相機「嗶」一聲!</p>
    <div class="mode-list">
      <button class="btn btn-green" id="startBtn">🛒 自由購物</button>
      <button class="btn btn-yellow" id="missionBtn">📝 購物任務</button>
      <button class="btn btn-pink" id="englishBtn">🔤 英文遊戲</button>
      <button class="btn btn-ghost" id="collectionBtn">📖 我的圖鑑</button>
    </div>
    <div class="db-badge" id="dbBadge">連線中…</div>
    <div class="settings-row">
      <button class="chip" id="toggleSound">🔊 音效</button>
      <button class="chip" id="toggleVoice">🗣️ 語音</button>
      <button class="chip" id="toggleEnglish">🔤 英文</button>
    </div>
  </section>

  <!-- SCAN -->
  <section class="screen" id="scanScreen">
    <div class="task-panel" id="taskPanel" style="display:none"></div>
    <div class="camera-frame">
      <div id="reader"></div>
      <div class="scan-line"></div>
    </div>
    <div class="hint" id="hint">把條碼放進畫面裡 👀</div>
    <button class="manual-link" id="manualBtn">掃不到?⌨️ 手動輸入號碼</button>
    <div class="scan-actions">
      <button class="btn btn-ghost" id="torchBtn" title="手電筒">🔦</button>
      <button class="btn btn-ghost" id="stopBtn">⏸ 休息一下</button>
      <button class="btn btn-yellow" id="checkoutBtn">🧾 結帳!</button>
    </div>
  </section>

  <!-- CHECKOUT -->
  <section class="screen" id="checkoutScreen">
    <div class="stars">⭐⭐⭐</div>
    <h2>結帳完成!</h2>
    <div class="receipt" id="receipt"></div>
    <p style="font-weight:800" id="checkoutMsg"></p>
    <div class="scan-actions" style="width:min(320px,86vw)">
      <button class="btn btn-ghost" id="againBtn">🔄 再玩一次</button>
      <button class="btn btn-green" id="payMoneyBtn">💰 去付錢</button>
    </div>
  </section>

  <!-- PAY -->
  <section class="screen" id="payScreen">
    <h2 style="font-size:24px;letter-spacing:2px;">💰 付錢囉!</h2>
    <div class="pay-total">要付 <b>$<span id="payTotal">0</span></b></div>
    <div class="pay-paid">已付 $<span id="paidAmount">0</span></div>
    <div class="pay-hint" id="payHint">點錢幣付錢吧!</div>
    <div class="money-grid" id="moneyGrid"></div>
    <div class="scan-actions" style="width:min(340px,88vw)">
      <button class="btn btn-ghost" id="payUndoBtn">↩ 拿回</button>
      <button class="btn btn-green dim" id="payDoneBtn" disabled>✔ 付好了</button>
    </div>
  </section>

  <!-- 英文遊戲結算 -->
  <section class="screen" id="quizEndScreen">
    <div class="stars" id="quizStars">⭐⭐⭐</div>
    <h2 style="font-size:24px;letter-spacing:2px;">英文遊戲結束!</h2>
    <div class="quiz-score" id="quizScore">0 / 5</div>
    <p style="font-weight:800" id="quizMsg"></p>
    <div class="scan-actions" style="width:min(320px,86vw)">
      <button class="btn btn-ghost" id="quizHomeBtn">🏠 回首頁</button>
      <button class="btn btn-green" id="quizAgainBtn">🔄 再玩一次</button>
    </div>
  </section>

  <!-- 圖鑑 -->
  <section class="screen" id="collectionScreen">
    <div class="coll-head">
      <h2>📖 我的圖鑑</h2>
      <div class="coll-prog" id="collProgress">已收集 0 / 0</div>
      <div class="coll-track"><div class="coll-bar" id="collBar"></div></div>
    </div>
    <div class="coll-body" id="collBody"></div>
    <button class="btn btn-yellow" id="collBackBtn" style="align-self:center;margin-top:12px">🏠 回首頁</button>
  </section>
</main>

<!-- CART OVERLAY -->
<div id="cartOverlay">
  <div class="cart-panel">
    <h3>🧺 我的籃子</h3>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-foot">
      <span>總共 $<span id="cartListTotal">0</span></span>
      <button class="btn btn-yellow" id="cartClose" style="font-size:16px;padding:10px 22px">好了</button>
    </div>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div id="resultOverlay">
  <div id="resultContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= data ================= */
const DEFAULT_CARDS = {
  "4710123456799": { name: "高麗菜", emoji: "🥬", price: 15, en: "Cabbage", category: "蔬菜" }
};
let cards = { ...DEFAULT_CARDS };
let cart = [];
let scanner = null;
let scanning = false;
let lastCode = null, lastTime = 0;
let paused = false;
let torchOn = false;

/* 付錢面額(元) */
const MONEY = [1, 5, 10, 50, 100, 500];
let paidStack = [];   // 已投入的錢幣,方便「拿回」
let payTotal = 0;

/* ================= 遊戲模式 ================= */
/* free = 自由掃描 / mission = 購物任務 / english = 英文遊戲 */
let mode = "free";
let mission = null;   // {goals:[{category,emoji,need,got}], done}
let quiz = null;      // {card, round, total, score, locked}

const CAT_EMOJI = {
  "蔬菜":"🥬","水果":"🍎","肉類":"🍗","海鮮":"🐟","蛋豆":"🥚",
  "乳品":"🥛","主食":"🍚","調味":"🍶","零食":"🍪","日用":"🧼","其他":"📦"
};
const QUIZ_ROUNDS = 5;

/* 圖鑑:記錄掃過哪些卡片 */
let seen = {};
function loadSeen(){

}
function markSeen(code){
  if(seen[code]) return;
  seen[code] = 1;
  try{ localStorage.setItem("cashier-seen", JSON.stringify(seen)); }catch(e){}
}

/* escape any user-provided string before putting it in HTML */
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ================= supabase + local cache ================= */
let sb = null;
function initDb(){
  try{
    if(window.SUPA_URL && window.SUPA_KEY &&
       !window.SUPA_URL.includes("YOUR_PROJECT") && window.supabase){
      sb = window.supabase.createClient(window.SUPA_URL, window.SUPA_KEY);
    }
  }catch(e){ sb = null; }
}
function cacheLocal(){
  try{ localStorage.setItem("cashier-cards", JSON.stringify(cards)); }catch(e){}
}
async function loadCards(){
  // 1. local cache first — instant start, works offline
  try{
    const c = localStorage.getItem("cashier-cards");
    if(c) cards = { ...DEFAULT_CARDS, ...JSON.parse(c) };
  }catch(e){}
  // 2. then sync from Supabase
  const badge = document.getElementById("dbBadge");
  if(!sb){ badge.textContent = "📴 離線模式(未設定資料庫)"; return; }
  try{
    const { data, error } = await sb.from("cards").select("barcode,name,emoji,price,en,category");
    if(error) throw error;
    (data || []).forEach(r => {
      cards[r.barcode] = {
        name: r.name, emoji: r.emoji, price: r.price ?? 10,
        en: r.en || "", category: r.category || "其他"
      };
    });
    cacheLocal();
    badge.textContent = `☁️ 已同步 ${Object.keys(cards).length} 張卡片`;
    badge.classList.add("ok");
  }catch(e){
    badge.textContent = "📴 離線模式(用上次的卡片)";
  }
}
async function saveCard(code, name, emoji, price, en){
  cards[code] = { name, emoji, price, en };
  cacheLocal();
  if(sb){
    try{ await sb.from("cards").insert({ barcode: code, name, emoji, price, en }); }
    catch(e){ /* offline or duplicate — local cache still has it */ }
  }
}
async function logSession(){
  if(sb && cart.length){
    try{
      await sb.from("game_sessions").insert({
        game_type: "cashier",
        score: cart.length,
        detail: {
          total: cartTotal(),
          items: cart.map(i => ({ code: i.code, name: i.name, price: i.price }))
        }
      });
    }catch(e){}
  }
}

/* ================= sounds ================= */
let audioCtx = null;
function beep(freq=1250, dur=0.12, type="square"){
  if(!settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function fanfare(){ beep(880,.12); setTimeout(()=>beep(1100,.12),120); setTimeout(()=>beep(1320,.25,"triangle"),240); }
/* 唸中文;有英文單字且開著英文時,接著再唸一次英文 */
function speak(text, en){
  if(!settings.voice) return;
  try{
    speechSynthesis.cancel();          // 先清掉上一次還沒唸完的
    if(text){
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-TW"; u.rate = 0.9; u.pitch = 1.3;
      speechSynthesis.speak(u);
    }
    if(en && settings.english){
      // speak() 會排隊,所以會等中文唸完才唸英文
      const u2 = new SpeechSynthesisUtterance(en);
      u2.lang = "en-US"; u2.rate = 0.75; u2.pitch = 1.15;
      speechSynthesis.speak(u2);
    }
  }catch(e){}
}

function confetti(){
  for(let i=0;i<24;i++){

    c.className = "confetti";

/* ================= scanner ================= */
/* 依模式開始遊戲 */
async function startMode(m){
  mode = m;
  cart = []; updateCart();
  mission = null; quiz = null;
  if(m === "mission"){
    mission = buildMission();
    if(!mission){ toast("還沒有卡片可以出任務 😅"); mode = "free"; }
  }
  if(m === "english"){
    if(!quizPool().length){
      toast("卡片還沒有英文單字,先去匯入吧 🔤");
      mode = "free";
    }else{
      quiz = { card:null, round:1, total:QUIZ_ROUNDS, score:0, locked:false };
    }
  }
  $("checkoutBtn").style.display = (mode === "english") ? "none" : "";
  await startScanner();
  if(mode === "english" && quiz) nextQuiz();
  else renderTaskPanel();
}

async function startScanner(){
  show("scanScreen");
  renderTaskPanel();
  if(scanning) return;
  const formats = [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.QR_CODE
  ];
  scanner = new Html5Qrcode("reader", {
    formatsToSupport: formats,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  });
  try{
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 15,
        // 較大的方形掃描區,QR / 條碼都比較好對準
        qrbox: (w,h)=>{ const m = Math.floor(Math.min(w,h) * 0.78); return { width: m, height: m }; }
      },
      onScan,
      ()=>{}
    );
    scanning = true;
    $("hint").textContent = "把條碼放進畫面裡 👀";
  }catch(err){
    toast("打不開相機 😢 請檢查相機權限");
    show("startScreen");
  }
}
async function stopScanner(){
  if(scanner && scanning){
    try{ await scanner.stop(); scanner.clear(); }catch(e){}
  }
  scanning = false; scanner = null; torchOn = false;
  $("torchBtn").classList.remove("on");
}
async function toggleTorch(){
  if(!scanner || !scanning){ return; }
  try{
    torchOn = !torchOn;
    await scanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
    $("torchBtn").classList.toggle("on", torchOn);
  }catch(e){
    torchOn = false;
    $("torchBtn").classList.remove("on");
    toast("這台裝置不支援手電筒 🔦");
  }
}
function onScan(code){
  const now = Date.now();
  if(paused) return;
  if(code === lastCode && now - lastTime < 3000) return;
  lastCode = code; lastTime = now;
  if(cards[code]) foundCard(code);
  else unknownCard(code);
}

/* ================= 購物任務單 ================= */
/* 依現有卡片的分類出題,只挑「真的有卡片」的分類,不會出到不可能完成的任務 */
function buildMission(){
  const byCat = {};
  Object.values(cards).forEach(c=>{
    const cat = c.category || "其他";
    byCat[cat] = (byCat[cat] || 0) + 1;
  });
  let cats = Object.keys(byCat);
  if(!cats.length) return null;
  // 洗牌後取 2~3 種分類
  cats = cats.sort(()=>Math.random()-0.5).slice(0, Math.min(3, cats.length));
  const goals = cats.map(cat=>({
    category: cat,
    emoji: CAT_EMOJI[cat] || "📦",
    // 需要的數量不超過該分類實際有的卡片數
    need: Math.min(byCat[cat], 1 + Math.floor(Math.random()*2)),
    got: 0
  }));
  return { goals, done:false };
}
function missionRemaining(){
  if(!mission) return 0;
  return mission.goals.reduce((s,g)=> s + Math.max(0, g.need - g.got), 0);
}
function renderTaskPanel(){
  const p = $("taskPanel");
  if(mode === "mission" && mission){
    const rows = mission.goals.map(g=>{
      const dots = Array.from({length:g.need}, (_,i)=> i < g.got ? "✅" : "⬜").join("");
      return `<div class="goal ${g.got>=g.need?'ok':''}">
                <span class="g-name">${g.emoji} ${esc(g.category)}</span>
                <span class="g-dots">${dots}</span>
              </div>`;
    }).join("");
    const left = missionRemaining();
    p.innerHTML = `<div class="task-title">📝 媽媽的購物單${left?"":" — 買齊了! 🎉"}</div>${rows}`;
    p.style.display = "";
  }else if(mode === "english" && quiz){
    // 這是「聽」的遊戲,單字預設遮起來,卡住時才偷看
    p.innerHTML = `
      <div class="task-title">🔤 聽英文找商品 (${quiz.round}/${quiz.total}) ⭐${quiz.score}</div>
      <div class="quiz-word hidden" id="quizWord">${esc(quiz.card.en)}</div>
      <div class="quiz-btns">
        <button class="btn btn-ghost" id="replayBtn">🔊 再聽一次</button>
        <button class="btn btn-ghost" id="peekBtn">👀 偷看</button>
      </div>`;
    p.style.display = "";
    $("replayBtn").addEventListener("click", ()=> sayQuiz());
    $("peekBtn").addEventListener("click", ()=>{
      $("quizWord").classList.remove("hidden");
      $("peekBtn").style.visibility = "hidden";
    });
  }else{
    p.style.display = "none";
  }
}

/* 掃到卡片時,更新任務進度;回傳是否算「達成」 */
function applyMission(item){
  if(!mission) return null;
  const g = mission.goals.find(g=> g.category === (item.category||"其他") && g.got < g.need);
  if(g){ g.got++; return g; }
  return null;
}

/* ================= 英文小遊戲 ================= */
function quizPool(){
  return Object.entries(cards)
    .filter(([,c])=> c.en && c.en.trim())
    .map(([code,c])=>({ code, ...c }));
}
function nextQuiz(){
  const pool = quizPool();
  if(!pool.length) return false;
  // 盡量不要連續出同一張
  let pick = pool[Math.floor(Math.random()*pool.length)];
  if(pool.length > 1 && quiz && quiz.card && pick.code === quiz.card.code){
    pick = pool[(pool.indexOf(pick)+1) % pool.length];
  }
  quiz.card = pick;
  quiz.locked = false;
  renderTaskPanel();
  setTimeout(sayQuiz, 350);
  return true;
}
function sayQuiz(){
  if(!quiz || !quiz.card) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(quiz.card.en);
    u.lang = "en-US"; u.rate = 0.7; u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}
function answerQuiz(code, item){
  if(quiz.locked) return;
  quiz.locked = true;
  const right = code === quiz.card.code;
  if(right){
    quiz.score++;
    beep(1200,.1); fanfare();
    if(navigator.vibrate) navigator.vibrate(80);
    $("resultContent").innerHTML = `
      <div class="praise">答對了! 🎉</div>
      <div class="result-card">
        <div class="veg">${esc(item.emoji)}</div>
        <div class="veg-name">${esc(item.name)}</div>
        <div class="veg-en">${esc(item.en)}</div>
      </div>`;
    speak(item.name, item.en);
  }else{
    beep(500,.18,"sawtooth");
    $("resultContent").innerHTML = `
      <div class="praise" style="color:#C88">再試試看 💪</div>
      <div class="result-card" style="background:var(--yellow)">
        <div class="veg">${esc(item.emoji)}</div>
        <div class="veg-name">${esc(item.name)}</div>
        <div class="veg-en">要找的是 ${esc(quiz.card.en)}</div>
      </div>`;
  }
  $("resultOverlay").classList.add("show");
  setTimeout(()=>{
    $("resultOverlay").classList.remove("show");
    paused = false;
    quiz.round++;
    if(quiz.round > quiz.total) finishQuiz();
    else nextQuiz();
  }, right ? 2200 : 2600);
}
function finishQuiz(){
  stopScanner();
  logQuiz();
  const stars = quiz.score >= quiz.total ? "⭐⭐⭐" : quiz.score >= quiz.total*0.6 ? "⭐⭐" : "⭐";
  $("quizStars").textContent = stars;
  $("quizScore").textContent = `${quiz.score} / ${quiz.total}`;
  $("quizMsg").textContent = quiz.score >= quiz.total
    ? "全對!你是英文小天才!"
    : quiz.score >= quiz.total*0.6 ? "很棒喔!再玩一次會更好!" : "沒關係,多聽幾次就記住了!";
  show("quizEndScreen");
  if(quiz.score) { fanfare(); confetti(); }
}
async function logQuiz(){
  if(!sb) return;
  try{
    await sb.from("game_sessions").insert({
      game_type: "english_quiz",
      score: quiz.score,
      detail: { total: quiz.total }
    });
  }catch(e){}
}

/* ================= 圖鑑 ================= */
function openCollection(){
  const groups = {};
  Object.entries(cards).forEach(([code,c])=>{
    const cat = c.category || "其他";
    (groups[cat] = groups[cat] || []).push({ code, ...c });
  });
  const total = Object.keys(cards).length;
  const got = Object.keys(cards).filter(c=>seen[c]).length;
  $("collProgress").textContent = `已收集 ${got} / ${total}`;
  $("collBar").style.width = total ? (got/total*100)+"%" : "0%";
  $("collBody").innerHTML = Object.keys(groups).sort().map(cat=>{
    const items = groups[cat].map(c=>{
      const has = !!seen[c.code];
      return `<div class="coll-card ${has?'':'locked'}" data-code="${esc(c.code)}">
                <div class="cc-emoji">${has ? esc(c.emoji) : "❓"}</div>
                <div class="cc-name">${has ? esc(c.name) : "???"}</div>
                ${has && c.en ? `<div class="cc-en">${esc(c.en)}</div>` : ""}
              </div>`;
    }).join("");
    return `<div class="coll-cat">${CAT_EMOJI[cat]||"📦"} ${esc(cat)}</div>
            <div class="coll-grid">${items}</div>`;
  }).join("");
  show("collectionScreen");
}

/* ================= game flow ================= */
function foundCard(code){
  const item = cards[code];
  if(!item){ unknownCard(code); return; }   // 保險:呼叫端沒檢查也不會炸
  markSeen(code);                       // 圖鑑點亮

  // 英文遊戲:掃到的卡片是「作答」,不進購物籃
  if(mode === "english" && quiz){
    paused = true;
    answerQuiz(code, item);
    return;
  }

  paused = true;
  cart.push({ code, ...item });
  updateCart();
  beep();
  if(navigator.vibrate) navigator.vibrate(80);

  // 購物任務:看看有沒有打勾
  let goalHit = null, justDone = false;
  if(mode === "mission" && mission){
    const before = missionRemaining();
    goalHit = applyMission(item);
    justDone = before > 0 && missionRemaining() === 0;
    renderTaskPanel();
  }

  const showEn = item.en && settings.english;
  speak(item.name, item.en);
  const tag = goalHit
    ? `<div class="hit-tag">✅ ${goalHit.emoji} ${esc(goalHit.category)} ${goalHit.got}/${goalHit.need}</div>`
    : (mode === "mission" ? `<div class="hit-tag off">這個不在單子上,也放進籃子囉</div>` : "");
  $("resultContent").innerHTML = `
    <div class="praise">${justDone ? "購物單買齊了! 🎉" : PRAISES[Math.floor(Math.random()*PRAISES.length)]}</div>
    <div class="result-card">
      <div class="veg">${esc(item.emoji)}</div>
      <div class="veg-name">${esc(item.name)}</div>
      ${showEn ? `<div class="veg-en">${esc(item.en)}</div>` : ""}
    </div>
    ${tag}`;
  $("resultOverlay").classList.add("show");
  if(justDone){ fanfare(); confetti(); speak("購物單買齊了,可以去結帳囉"); }
  // 要多唸一句英文,畫面就多停一下
  setTimeout(()=>{
    $("resultOverlay").classList.remove("show");
    paused = false;
  }, showEn ? 2600 : 1900);
}

function unknownCard(code){
  paused = true;
  beep(600,.15,"sawtooth");
  let selEmoji = "🥬";
  const grid = EMOJIS.map(e=>`<button type="button" data-e="${e}" class="${e===selEmoji?'sel':''}">${e}</button>`).join("");
  $("resultContent").innerHTML = `
    <div id="newCardForm">
      <h3>🆕 新卡片!這是什麼呢?</h3>
      <div class="code">${esc(code)}</div>
      <input id="newName" placeholder="輸入名字,例如:紅蘿蔔" maxlength="8">
      <input id="newEn" placeholder="英文(可留空),例如:Carrot" maxlength="30">
      <input id="newPrice" type="number" inputmode="numeric" min="1" max="999" value="10" placeholder="價格(元)">
      <div class="emoji-grid" id="emojiGrid">${grid}</div>
      <button class="btn btn-green" id="saveCardBtn" style="font-size:17px">✔ 記住這張卡</button>
      <button class="btn btn-ghost" id="skipCardBtn" style="font-size:15px;padding:10px">先跳過</button>
    </div>`;
  $("resultOverlay").classList.add("show");

  $("emojiGrid").addEventListener("click", ev=>{
    const b = ev.target.closest("button[data-e]");
    if(!b) return;
    selEmoji = b.dataset.e;
    document.querySelectorAll("#emojiGrid button").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");
  });
  $("saveCardBtn").addEventListener("click", async ()=>{
    const name = $("newName").value.trim();
    if(!name){ toast("先幫卡片取個名字吧 ✏️"); return; }
    let price = parseInt($("newPrice").value, 10);
    if(isNaN(price) || price < 0){ price = 10; }
    price = Math.min(price, 9999);
    const en = $("newEn").value.trim().slice(0, 30);
    await saveCard(code, name, selEmoji, price, en);
    $("resultOverlay").classList.remove("show");
    paused = false;
    toast(`記住囉!下次掃到就是「${name}」`);
    foundCard(code);
  });
  $("skipCardBtn").addEventListener("click", ()=>{
    $("resultOverlay").classList.remove("show");
    paused = false;
  });
}

function checkout(){
  stopScanner();
  closeCart();
  logSession();
  const counts = {};
  cart.forEach(i=>{
    counts[i.code] = counts[i.code] || { ...i, n: 0 };
    counts[i.code].n++;
  });
  const total = cartTotal();
  const rows = Object.values(counts)
    .map(i=>`<div class="row"><span>${esc(i.emoji)} ${esc(i.name)}${
        (i.en && settings.english) ? ` <em>${esc(i.en)}</em>` : ""
      } <small>$${i.price||0}</small></span><span class="n">× ${i.n}</span></div>`)
    .join("");
  const totalRow = cart.length
    ? `<div class="row total-row"><span>總共</span><span class="n">$${total}</span></div>`
    : "";
  $("receipt").innerHTML = (rows + totalRow) || `<div class="row"><span>籃子空空的 🧺</span></div>`;
  let msg = cart.length
    ? `一共買了 ${cart.length} 樣,要付 ${total} 元!`
    : "下次多掃幾張卡片試試看吧!";
  if(mode === "mission" && mission){
    msg = missionRemaining() === 0
      ? `購物單全部買齊了! 一共 ${total} 元,你真棒!`
      : `購物單還差 ${missionRemaining()} 樣,不過也沒關係!`;
  }
  $("checkoutMsg").textContent = msg;
  $("payMoneyBtn").style.display = cart.length ? "" : "none";
  show("checkoutScreen");
  if(cart.length){ fanfare(); confetti(); speak(`結帳完成,一共 ${total} 元`); }
}

/* ================= 付錢找零 ================= */
function startPay(){
  payTotal = cartTotal();
  paidStack = [];
  $("payTotal").textContent = payTotal;
  const grid = MONEY.map(m=>
    `<button class="money-btn" data-m="${m}">$${m}</button>`).join("");
  $("moneyGrid").innerHTML = grid;
  renderPaid();
  show("payScreen");
  speak(`請付 ${payTotal} 元`);
}
function paidAmount(){ return paidStack.reduce((a,b)=>a+b, 0); }
function renderPaid(){
  const paid = paidAmount();
  $("paidAmount").textContent = paid;
  const remain = payTotal - paid;
  const done = $("payDoneBtn");
  if(remain > 0){
    $("payHint").textContent = `還差 ${remain} 元`;
    done.disabled = true; done.classList.add("dim");
  }else{
    $("payHint").textContent = remain === 0 ? "剛剛好!可以付了 ✨" : "夠了!可以付了 ✨";
    done.disabled = false; done.classList.remove("dim");
  }
}
function addMoney(m){
  paidStack.push(m);
  beep(700 + m, .06);
  renderPaid();
}
function undoMoney(){
  if(paidStack.length){ paidStack.pop(); beep(400,.06); renderPaid(); }
}
function finishPay(){
  const paid = paidAmount();
  if(paid < payTotal){ toast("錢還不夠喔,再加一點 💰"); return; }
  const change = paid - payTotal;
  fanfare(); confetti();
  const msg = change === 0 ? "剛剛好,不用找零!" : `找你 ${change} 元`;
  speak("付款成功," + msg);
  $("resultContent").innerHTML = `
    <div class="praise">付款成功! 🎉</div>
    <div class="result-card">
      <div class="veg">💰</div>
      <div class="veg-name">${esc(msg)}</div>
    </div>
    <button class="btn btn-pink" id="payAgainBtn" style="font-size:18px">🔄 再玩一次</button>`;
  $("resultOverlay").classList.add("show");
  $("payAgainBtn").addEventListener("click", async ()=>{
    $("resultOverlay").classList.remove("show");
    await startMode(mode);
  });
}

/* ================= events ================= */
$("startBtn").addEventListener("click", async ()=>{ beep(900,.08); await startMode("free"); });
$("missionBtn").addEventListener("click", async ()=>{ beep(900,.08); await startMode("mission"); });
$("englishBtn").addEventListener("click", async ()=>{ beep(900,.08); await startMode("english"); });
$("collectionBtn").addEventListener("click", ()=>{ beep(900,.08); openCollection(); });
$("collBackBtn").addEventListener("click", ()=> show("startScreen"));
$("quizHomeBtn").addEventListener("click", ()=> show("startScreen"));
$("quizAgainBtn").addEventListener("click", async ()=> await startMode("english"));

/* 圖鑑:點卡片重聽發音 */
$("collBody").addEventListener("click", ev=>{
  const el = ev.target.closest(".coll-card"); if(!el) return;
  const c = cards[el.dataset.code];
  if(!c || !seen[el.dataset.code]) return;
  speak(c.name, c.en);
});

$("stopBtn").addEventListener("click", async ()=>{ await stopScanner(); show("startScreen"); });
$("checkoutBtn").addEventListener("click", checkout);
$("torchBtn").addEventListener("click", toggleTorch);
$("manualBtn").addEventListener("click", manualEntry);
$("againBtn").addEventListener("click", async ()=>{ await startMode(mode === "english" ? "free" : mode); });
$("payMoneyBtn").addEventListener("click", startPay);

/* 付錢面板 */
$("moneyGrid").addEventListener("click", ev=>{
  const b = ev.target.closest("button[data-m]");
  if(b) addMoney(parseInt(b.dataset.m, 10));
});
$("payUndoBtn").addEventListener("click", undoMoney);
$("payDoneBtn").addEventListener("click", finishPay);

/* 籃子(移除商品) */
$("cartPill").addEventListener("click", openCart);
$("cartClose").addEventListener("click", closeCart);
$("cartList").addEventListener("click", ev=>{
  const b = ev.target.closest("button[data-code]");
  if(b) removeOne(b.dataset.code);
});

/* 音效 / 語音開關 */
function refreshSettingUI(){
  $("toggleSound").classList.toggle("off", !settings.sound);
  $("toggleVoice").classList.toggle("off", !settings.voice);
  $("toggleEnglish").classList.toggle("off", !settings.english);
  $("toggleSound").textContent = settings.sound ? "🔊 音效" : "🔇 音效";
  $("toggleVoice").textContent = settings.voice ? "🗣️ 語音" : "🤫 語音";
  $("toggleEnglish").textContent = "🔤 英文";
}
$("toggleSound").addEventListener("click", ()=>{
  settings.sound = !settings.sound; saveSettings(); refreshSettingUI();
  if(settings.sound) beep(900,.08);
});
$("toggleVoice").addEventListener("click", ()=>{
  settings.voice = !settings.voice; saveSettings(); refreshSettingUI();
  if(settings.voice) speak("語音打開囉");
});
$("toggleEnglish").addEventListener("click", ()=>{
  settings.english = !settings.english; saveSettings(); refreshSettingUI();
  if(settings.english) speak("英文打開囉", "Hello");
});

loadSettings();
loadSeen();
refreshSettingUI();
initDb();
loadCards();
</script>
