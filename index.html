<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小小收銀員 🛒</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --pink:#F7B7CF;
    --pink-deep:#EE8FB6;
    --cream:#FFF9F2;
    --green:#6FBF4A;
    --ink:#443344;
    --yellow:#FFD666;
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    display:flex;flex-direction:column;
    overflow:hidden;
    user-select:none;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(var(--pink) 1.5px, transparent 1.5px);
    background-size:26px 26px;opacity:.25;
  }

  header{
    padding:14px 18px 10px;
    display:flex;align-items:center;justify-content:space-between;
    position:relative;z-index:2;
  }
  header h1{font-size:22px;letter-spacing:2px;}
  header h1 .emoji{font-size:26px;}
  .cart-pill{
    background:var(--white);border:3px solid var(--ink);border-radius:999px;
    padding:6px 14px;font-weight:800;font-size:16px;
    box-shadow:3px 3px 0 var(--pink-deep);
    display:flex;align-items:center;gap:6px;
  }
  .cart-pill.bump{animation:bump .4s ease;}
  @keyframes bump{30%{transform:scale(1.25) rotate(-6deg);}}

  main{flex:1;display:flex;flex-direction:column;position:relative;z-index:1;padding:0 16px 16px;min-height:0;}

  .screen{display:none;flex:1;flex-direction:column;min-height:0;}
  .screen.active{display:flex;}

  #startScreen{align-items:center;justify-content:center;text-align:center;gap:18px;}
  .big-card{
    background:var(--pink);border:4px solid var(--ink);border-radius:24px;
    width:180px;padding:22px 16px 16px;
    box-shadow:6px 6px 0 var(--ink);
    transform:rotate(-3deg);
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{50%{transform:rotate(-3deg) translateY(-8px);}}
  .big-card .veg{font-size:72px;line-height:1;}
  .big-card .veg-name{margin-top:10px;font-weight:900;font-size:20px;letter-spacing:4px;}
  .big-card .bars{margin-top:12px;background:var(--white);border-radius:8px;padding:6px 8px;
    background-image:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px);
    background-clip:content-box;height:34px;}
  #startScreen p{font-size:16px;line-height:1.7;max-width:280px;}
  .db-badge{font-size:12px;font-weight:700;color:#A89;}
  .db-badge.ok{color:var(--green);}
  .btn{
    border:4px solid var(--ink);border-radius:999px;
    font-family:inherit;font-weight:900;font-size:20px;letter-spacing:2px;
    padding:14px 34px;cursor:pointer;color:var(--ink);
    box-shadow:0 5px 0 var(--ink);
    transition:transform .1s, box-shadow .1s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
  .btn-green{background:var(--green);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2);}
  .btn-yellow{background:var(--yellow);}
  .btn-pink{background:var(--pink);}
  .btn-ghost{background:var(--white);}

  #scanScreen{gap:12px;}
  .camera-frame{
    position:relative;flex:1;min-height:0;
    border:4px solid var(--ink);border-radius:24px;overflow:hidden;
    background:#222;box-shadow:6px 6px 0 var(--pink-deep);
  }
  #reader{width:100%;height:100%;}
  #reader video{width:100%!important;height:100%!important;object-fit:cover;}
  .scan-line{
    position:absolute;left:10%;right:10%;height:4px;border-radius:4px;
    background:var(--yellow);box-shadow:0 0 12px var(--yellow);
    animation:scanline 1.6s ease-in-out infinite;pointer-events:none;z-index:5;
  }
  @keyframes scanline{0%,100%{top:20%;}50%{top:75%;}}
  .hint{
    text-align:center;font-size:15px;font-weight:700;color:var(--ink);
    background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:8px;
  }
  .scan-actions{display:flex;gap:10px;}
  .scan-actions .btn{flex:1;font-size:16px;padding:12px 8px;}

  #resultOverlay{
    position:fixed;inset:0;background:rgba(255,249,242,.96);z-index:50;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;
  }
  #resultOverlay.show{display:flex;}
  .result-card{
    background:var(--pink);border:5px solid var(--ink);border-radius:28px;
    width:min(240px,70vw);padding:28px 20px 20px;text-align:center;
    box-shadow:8px 8px 0 var(--ink);
    animation:pop .45s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
  .result-card .veg{font-size:96px;line-height:1;animation:wiggle 1s ease .3s;}
  @keyframes wiggle{25%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}75%{transform:rotate(-4deg);}}
  .result-card .veg-name{margin-top:12px;font-weight:900;font-size:28px;letter-spacing:6px;}
  .praise{font-size:22px;font-weight:900;color:var(--pink-deep);animation:pop .5s .15s both;}

  #newCardForm{
    background:var(--white);border:4px solid var(--ink);border-radius:24px;
    padding:20px;width:min(340px,88vw);box-shadow:6px 6px 0 var(--ink);
    display:flex;flex-direction:column;gap:14px;
  }
  #newCardForm h3{font-size:18px;text-align:center;}
  #newCardForm .code{font-size:12px;color:#997;text-align:center;font-family:monospace;}
  #newCardForm input{
    border:3px solid var(--ink);border-radius:12px;padding:12px;font-size:18px;
    font-family:inherit;width:100%;text-align:center;
  }
  .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .emoji-grid button{
    font-size:26px;background:var(--cream);border:2px solid transparent;border-radius:10px;
    padding:6px 0;cursor:pointer;
  }
  .emoji-grid button.sel{border-color:var(--ink);background:var(--yellow);}

  #checkoutScreen{align-items:center;justify-content:center;gap:16px;text-align:center;}
  #checkoutScreen h2{font-size:26px;letter-spacing:3px;}
  .receipt{
    background:var(--white);border:4px solid var(--ink);border-radius:18px;
    width:min(320px,86vw);max-height:44vh;overflow:auto;padding:16px;
    box-shadow:6px 6px 0 var(--pink-deep);
  }
  .receipt .row{display:flex;justify-content:space-between;align-items:center;
    font-size:20px;font-weight:800;padding:8px 4px;border-bottom:2px dashed #EBD;}
  .receipt .row:last-child{border-bottom:none;}
  .receipt .row .n{color:var(--pink-deep);}
  .stars{font-size:34px;letter-spacing:6px;animation:pop .6s both;}

  .confetti{position:fixed;top:-20px;font-size:24px;z-index:60;pointer-events:none;
    animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;
    font-size:14px;font-weight:700;z-index:70;opacity:0;transition:opacity .3s;
    max-width:86vw;text-align:center;
  }
  .toast.show{opacity:1;}

  /* 設定 chip(音效/語音) */
  .settings-row{display:flex;gap:10px;margin-top:4px;}
  .chip{
    font-family:inherit;font-weight:800;font-size:14px;
    background:var(--white);border:3px solid var(--ink);border-radius:999px;
    padding:8px 16px;cursor:pointer;color:var(--ink);
    box-shadow:2px 2px 0 var(--ink);
  }
  .chip.off{opacity:.45;text-decoration:line-through;box-shadow:none;}

  /* 手電筒亮起 */
  #torchBtn{flex:0 0 auto;padding:12px 14px;}
  #torchBtn.on{background:var(--yellow);box-shadow:0 5px 0 var(--ink),0 0 16px var(--yellow);}

  /* 收據價格 */
  .receipt .row small{font-weight:700;color:#B9A;font-size:14px;}
  .receipt .row.total-row{border-top:3px solid var(--ink);border-bottom:none;
    margin-top:4px;padding-top:10px;font-size:22px;}
  .receipt .row.total-row .n{color:var(--green);}

  /* 付錢畫面 */
  #payScreen{align-items:center;justify-content:center;gap:12px;text-align:center;}
  .pay-total{font-size:22px;font-weight:800;}
  .pay-total b{color:var(--pink-deep);font-size:28px;}
  .pay-paid{font-size:18px;font-weight:800;color:var(--green);}
  .pay-hint{font-size:15px;font-weight:700;color:var(--ink);
    background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;}
  .money-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    width:min(340px,88vw);}
  .money-btn{
    font-family:inherit;font-weight:900;font-size:22px;color:var(--ink);
    background:var(--yellow);border:4px solid var(--ink);border-radius:16px;
    padding:18px 0;cursor:pointer;box-shadow:0 5px 0 var(--ink);
    transition:transform .1s, box-shadow .1s;
  }
  .money-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
  .btn.dim{opacity:.4;box-shadow:0 5px 0 var(--ink);cursor:not-allowed;}

  /* 籃子 overlay */
  #cartOverlay{
    position:fixed;inset:0;background:rgba(68,51,68,.55);z-index:55;
    display:none;align-items:flex-end;justify-content:center;
  }
  #cartOverlay.show{display:flex;}
  .cart-panel{
    background:var(--cream);border:4px solid var(--ink);
    border-radius:24px 24px 0 0;width:min(440px,100%);
    padding:20px 18px 24px;box-shadow:0 -6px 0 var(--pink-deep);
    max-height:80vh;display:flex;flex-direction:column;gap:12px;
    animation:slideUp .3s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .cart-panel h3{font-size:20px;text-align:center;letter-spacing:2px;}
  .cart-list{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:60px;}
  .cart-item{
    display:flex;align-items:center;gap:8px;
    background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;
  }
  .cart-item .ci-name{flex:1;font-weight:800;font-size:17px;}
  .cart-item .ci-mid{font-weight:700;font-size:14px;color:#B9A;}
  .ci-remove{
    font-size:18px;background:var(--pink);border:3px solid var(--ink);border-radius:10px;
    width:38px;height:38px;cursor:pointer;flex:0 0 auto;box-shadow:2px 2px 0 var(--ink);
  }
  .ci-remove:active{transform:translateY(2px);box-shadow:none;}
  .cart-empty{text-align:center;color:#A89;font-weight:700;padding:20px;line-height:1.8;}
  .cart-foot{display:flex;align-items:center;justify-content:space-between;
    font-size:20px;font-weight:900;padding-top:6px;border-top:3px dashed #EBD;}
</style>
</head>
<body>
<header>
  <h1><span class="emoji">🛒</span> 小小收銀員</h1>
  <div class="cart-pill" id="cartPill">🧺 <span id="cartCount">0</span></div>
</header>

<main>
  <!-- START -->
  <section class="screen active" id="startScreen">
    <div class="big-card">
      <div class="veg">🥬</div>
      <div class="veg-name">高麗菜</div>
      <div class="bars"></div>
    </div>
    <p>拿起你的小卡片，<br>對準相機「嗶」一聲，<br>把菜菜放進購物籃吧!</p>
    <button class="btn btn-green" id="startBtn">▶ 開始掃描</button>
    <div class="db-badge" id="dbBadge">連線中…</div>
    <div class="settings-row">
      <button class="chip" id="toggleSound">🔊 音效</button>
      <button class="chip" id="toggleVoice">🗣️ 語音</button>
    </div>
  </section>

  <!-- SCAN -->
  <section class="screen" id="scanScreen">
    <div class="camera-frame">
      <div id="reader"></div>
      <div class="scan-line"></div>
    </div>
    <div class="hint" id="hint">把條碼放進畫面裡 👀</div>
    <div class="scan-actions">
      <button class="btn btn-ghost" id="torchBtn" title="手電筒">🔦</button>
      <button class="btn btn-ghost" id="stopBtn">⏸ 休息一下</button>
      <button class="btn btn-yellow" id="checkoutBtn">🧾 結帳!</button>
    </div>
  </section>

  <!-- CHECKOUT -->
  <section class="screen" id="checkoutScreen">
    <div class="stars">⭐⭐⭐</div>
    <h2>結帳完成!</h2>
    <div class="receipt" id="receipt"></div>
    <p style="font-weight:800" id="checkoutMsg"></p>
    <div class="scan-actions" style="width:min(320px,86vw)">
      <button class="btn btn-ghost" id="againBtn">🔄 再玩一次</button>
      <button class="btn btn-green" id="payMoneyBtn">💰 去付錢</button>
    </div>
  </section>

  <!-- PAY -->
  <section class="screen" id="payScreen">
    <h2 style="font-size:24px;letter-spacing:2px;">💰 付錢囉!</h2>
    <div class="pay-total">要付 <b>$<span id="payTotal">0</span></b></div>
    <div class="pay-paid">已付 $<span id="paidAmount">0</span></div>
    <div class="pay-hint" id="payHint">點錢幣付錢吧!</div>
    <div class="money-grid" id="moneyGrid"></div>
    <div class="scan-actions" style="width:min(340px,88vw)">
      <button class="btn btn-ghost" id="payUndoBtn">↩ 拿回</button>
      <button class="btn btn-green dim" id="payDoneBtn" disabled>✔ 付好了</button>
    </div>
  </section>
</main>

<!-- CART OVERLAY -->
<div id="cartOverlay">
  <div class="cart-panel">
    <h3>🧺 我的籃子</h3>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-foot">
      <span>總共 $<span id="cartListTotal">0</span></span>
      <button class="btn btn-yellow" id="cartClose" style="font-size:16px;padding:10px 22px">好了</button>
    </div>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div id="resultOverlay">
  <div id="resultContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= data ================= */
const DEFAULT_CARDS = {
  "4710123456799": { name: "高麗菜", emoji: "🥬", price: 15 }
};
let cards = { ...DEFAULT_CARDS };
let cart = [];
let scanner = null;
let scanning = false;
let lastCode = null, lastTime = 0;
let paused = false;
let torchOn = false;

/* 付錢面額(元) */
const MONEY = [1, 5, 10, 50, 100, 500];
let paidStack = [];   // 已投入的錢幣,方便「拿回」
let payTotal = 0;

/* 家長設定,存 localStorage */
let settings = { sound: true, voice: true };
function loadSettings(){
  try{
    const s = localStorage.getItem("cashier-settings");
    if(s) settings = { ...settings, ...JSON.parse(s) };
  }catch(e){}
}
function saveSettings(){
  try{ localStorage.setItem("cashier-settings", JSON.stringify(settings)); }catch(e){}
}

const EMOJIS = ["🥬","🥕","🍅","🌽","🥦","🥒","🍆","🥔","🧅","🍄","🎃","🌶️","🍎","🍌","🍇","🍓","🍊","🍉","🥚","🥛","🍞","🧀","🐟","🍗"];
const PRAISES = ["嗶!掃到囉!","太棒了!","好厲害!","嗶嗶~收到!","放進籃子囉!","你是掃描高手!"];

/* escape any user-provided string before putting it in HTML */
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ================= supabase + local cache ================= */
let sb = null;
function initDb(){
  try{
    if(window.SUPA_URL && window.SUPA_KEY &&
       !window.SUPA_URL.includes("YOUR_PROJECT") && window.supabase){
      sb = window.supabase.createClient(window.SUPA_URL, window.SUPA_KEY);
    }
  }catch(e){ sb = null; }
}
function cacheLocal(){
  try{ localStorage.setItem("cashier-cards", JSON.stringify(cards)); }catch(e){}
}
async function loadCards(){
  // 1. local cache first — instant start, works offline
  try{
    const c = localStorage.getItem("cashier-cards");
    if(c) cards = { ...DEFAULT_CARDS, ...JSON.parse(c) };
  }catch(e){}
  // 2. then sync from Supabase
  const badge = document.getElementById("dbBadge");
  if(!sb){ badge.textContent = "📴 離線模式(未設定資料庫)"; return; }
  try{
    const { data, error } = await sb.from("cards").select("barcode,name,emoji,price");
    if(error) throw error;
    (data || []).forEach(r => { cards[r.barcode] = { name: r.name, emoji: r.emoji, price: r.price ?? 10 }; });
    cacheLocal();
    badge.textContent = `☁️ 已同步 ${Object.keys(cards).length} 張卡片`;
    badge.classList.add("ok");
  }catch(e){
    badge.textContent = "📴 離線模式(用上次的卡片)";
  }
}
async function saveCard(code, name, emoji, price){
  cards[code] = { name, emoji, price };
  cacheLocal();
  if(sb){
    try{ await sb.from("cards").insert({ barcode: code, name, emoji, price }); }
    catch(e){ /* offline or duplicate — local cache still has it */ }
  }
}
async function logSession(){
  if(sb && cart.length){
    try{
      await sb.from("game_sessions").insert({
        game_type: "cashier",
        score: cart.length,
        detail: {
          total: cartTotal(),
          items: cart.map(i => ({ code: i.code, name: i.name, price: i.price }))
        }
      });
    }catch(e){}
  }
}

/* ================= sounds ================= */
let audioCtx = null;
function beep(freq=1250, dur=0.12, type="square"){
  if(!settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function fanfare(){ beep(880,.12); setTimeout(()=>beep(1100,.12),120); setTimeout(()=>beep(1320,.25,"triangle"),240); }
function speak(text){
  if(!settings.voice) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-TW"; u.rate = 0.9; u.pitch = 1.3;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= ui helpers ================= */
const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2600);
}
function cartTotal(){
  return cart.reduce((s,i)=> s + (i.price || 0), 0);
}
function updateCart(){
  $("cartCount").textContent = cart.length;
  const p = $("cartPill"); p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump");
  if($("cartOverlay").classList.contains("show")) renderCartList();
}

/* 打開籃子,可以把掃錯的商品拿掉 */
function openCart(){
  renderCartList();
  $("cartOverlay").classList.add("show");
}
function closeCart(){ $("cartOverlay").classList.remove("show"); }
function renderCartList(){
  const counts = {};
  cart.forEach(i=>{
    counts[i.code] = counts[i.code] || { ...i, n: 0 };
    counts[i.code].n++;
  });
  const rows = Object.values(counts).map(i=>`
    <div class="cart-item">
      <span class="ci-name">${esc(i.emoji)} ${esc(i.name)}</span>
      <span class="ci-mid">$${i.price||0} × ${i.n}</span>
      <button class="ci-remove" data-code="${esc(i.code)}">➖</button>
    </div>`).join("");
  $("cartList").innerHTML = rows ||
    `<div class="cart-empty">籃子空空的 🧺<br>去掃幾張卡片吧!</div>`;
  $("cartListTotal").textContent = cartTotal();
}
function removeOne(code){
  const idx = cart.map(i=>i.code).lastIndexOf(code);
  if(idx >= 0){ cart.splice(idx,1); updateCart(); beep(500,.06); }
}
function confetti(){
  for(let i=0;i<24;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.textContent = ["🎉","⭐","🥬","🍅","💖","✨"][i%6];
    c.style.left = Math.random()*100 + "vw";
    c.style.animationDuration = (1.4 + Math.random()*1.6) + "s";
    c.style.animationDelay = (Math.random()*0.5) + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 3500);
  }
}

/* ================= scanner ================= */
async function startScanner(){
  show("scanScreen");
  if(scanning) return;
  const formats = [
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.QR_CODE
  ];
  scanner = new Html5Qrcode("reader", { formatsToSupport: formats });
  try{
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: (w,h)=>({ width: Math.floor(w*0.8), height: Math.floor(h*0.45) }) },
      onScan,
      ()=>{}
    );
    scanning = true;
    $("hint").textContent = "把條碼放進畫面裡 👀";
  }catch(err){
    toast("打不開相機 😢 請檢查相機權限");
    show("startScreen");
  }
}
async function stopScanner(){
  if(scanner && scanning){
    try{ await scanner.stop(); scanner.clear(); }catch(e){}
  }
  scanning = false; scanner = null; torchOn = false;
  $("torchBtn").classList.remove("on");
}
async function toggleTorch(){
  if(!scanner || !scanning){ return; }
  try{
    torchOn = !torchOn;
    await scanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
    $("torchBtn").classList.toggle("on", torchOn);
  }catch(e){
    torchOn = false;
    $("torchBtn").classList.remove("on");
    toast("這台裝置不支援手電筒 🔦");
  }
}
function onScan(code){
  const now = Date.now();
  if(paused) return;
  if(code === lastCode && now - lastTime < 3000) return;
  lastCode = code; lastTime = now;
  if(cards[code]) foundCard(code);
  else unknownCard(code);
}

/* ================= game flow ================= */
function foundCard(code){
  paused = true;
  const item = cards[code];
  cart.push({ code, ...item });
  updateCart();
  beep();
  if(navigator.vibrate) navigator.vibrate(80);
  speak(item.name);
  $("resultContent").innerHTML = `
    <div class="praise">${PRAISES[Math.floor(Math.random()*PRAISES.length)]}</div>
    <div class="result-card">
      <div class="veg">${esc(item.emoji)}</div>
      <div class="veg-name">${esc(item.name)}</div>
    </div>`;
  $("resultOverlay").classList.add("show");
  setTimeout(()=>{
    $("resultOverlay").classList.remove("show");
    paused = false;
  }, 1900);
}

function unknownCard(code){
  paused = true;
  beep(600,.15,"sawtooth");
  let selEmoji = "🥬";
  const grid = EMOJIS.map(e=>`<button type="button" data-e="${e}" class="${e===selEmoji?'sel':''}">${e}</button>`).join("");
  $("resultContent").innerHTML = `
    <div id="newCardForm">
      <h3>🆕 新卡片!這是什麼呢?</h3>
      <div class="code">${esc(code)}</div>
      <input id="newName" placeholder="輸入名字,例如:紅蘿蔔" maxlength="8">
      <input id="newPrice" type="number" inputmode="numeric" min="1" max="999" value="10" placeholder="價格(元)">
      <div class="emoji-grid" id="emojiGrid">${grid}</div>
      <button class="btn btn-green" id="saveCardBtn" style="font-size:17px">✔ 記住這張卡</button>
      <button class="btn btn-ghost" id="skipCardBtn" style="font-size:15px;padding:10px">先跳過</button>
    </div>`;
  $("resultOverlay").classList.add("show");

  $("emojiGrid").addEventListener("click", ev=>{
    const b = ev.target.closest("button[data-e]");
    if(!b) return;
    selEmoji = b.dataset.e;
    document.querySelectorAll("#emojiGrid button").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");
  });
  $("saveCardBtn").addEventListener("click", async ()=>{
    const name = $("newName").value.trim();
    if(!name){ toast("先幫卡片取個名字吧 ✏️"); return; }
    let price = parseInt($("newPrice").value, 10);
    if(isNaN(price) || price < 0){ price = 10; }
    price = Math.min(price, 9999);
    await saveCard(code, name, selEmoji, price);
    $("resultOverlay").classList.remove("show");
    paused = false;
    toast(`記住囉!下次掃到就是「${name}」`);
    foundCard(code);
  });
  $("skipCardBtn").addEventListener("click", ()=>{
    $("resultOverlay").classList.remove("show");
    paused = false;
  });
}

function checkout(){
  stopScanner();
  closeCart();
  logSession();
  const counts = {};
  cart.forEach(i=>{
    counts[i.code] = counts[i.code] || { ...i, n: 0 };
    counts[i.code].n++;
  });
  const total = cartTotal();
  const rows = Object.values(counts)
    .map(i=>`<div class="row"><span>${esc(i.emoji)} ${esc(i.name)} <small>$${i.price||0}</small></span><span class="n">× ${i.n}</span></div>`)
    .join("");
  const totalRow = cart.length
    ? `<div class="row total-row"><span>總共</span><span class="n">$${total}</span></div>`
    : "";
  $("receipt").innerHTML = (rows + totalRow) || `<div class="row"><span>籃子空空的 🧺</span></div>`;
  $("checkoutMsg").textContent = cart.length
    ? `一共買了 ${cart.length} 樣,要付 ${total} 元!`
    : "下次多掃幾張卡片試試看吧!";
  $("payMoneyBtn").style.display = cart.length ? "" : "none";
  show("checkoutScreen");
  if(cart.length){ fanfare(); confetti(); speak(`結帳完成,一共 ${total} 元`); }
}

/* ================= 付錢找零 ================= */
function startPay(){
  payTotal = cartTotal();
  paidStack = [];
  $("payTotal").textContent = payTotal;
  const grid = MONEY.map(m=>
    `<button class="money-btn" data-m="${m}">$${m}</button>`).join("");
  $("moneyGrid").innerHTML = grid;
  renderPaid();
  show("payScreen");
  speak(`請付 ${payTotal} 元`);
}
function paidAmount(){ return paidStack.reduce((a,b)=>a+b, 0); }
function renderPaid(){
  const paid = paidAmount();
  $("paidAmount").textContent = paid;
  const remain = payTotal - paid;
  const done = $("payDoneBtn");
  if(remain > 0){
    $("payHint").textContent = `還差 ${remain} 元`;
    done.disabled = true; done.classList.add("dim");
  }else{
    $("payHint").textContent = remain === 0 ? "剛剛好!可以付了 ✨" : "夠了!可以付了 ✨";
    done.disabled = false; done.classList.remove("dim");
  }
}
function addMoney(m){
  paidStack.push(m);
  beep(700 + m, .06);
  renderPaid();
}
function undoMoney(){
  if(paidStack.length){ paidStack.pop(); beep(400,.06); renderPaid(); }
}
function finishPay(){
  const paid = paidAmount();
  if(paid < payTotal){ toast("錢還不夠喔,再加一點 💰"); return; }
  const change = paid - payTotal;
  fanfare(); confetti();
  const msg = change === 0 ? "剛剛好,不用找零!" : `找你 ${change} 元`;
  speak("付款成功," + msg);
  $("resultContent").innerHTML = `
    <div class="praise">付款成功! 🎉</div>
    <div class="result-card">
      <div class="veg">💰</div>
      <div class="veg-name">${esc(msg)}</div>
    </div>
    <button class="btn btn-pink" id="payAgainBtn" style="font-size:18px">🔄 再玩一次</button>`;
  $("resultOverlay").classList.add("show");
  $("payAgainBtn").addEventListener("click", async ()=>{
    $("resultOverlay").classList.remove("show");
    cart = []; updateCart(); await startScanner();
  });
}

/* ================= events ================= */
$("startBtn").addEventListener("click", async ()=>{ beep(900,.08); await startScanner(); });
$("stopBtn").addEventListener("click", async ()=>{ await stopScanner(); show("startScreen"); });
$("checkoutBtn").addEventListener("click", checkout);
$("torchBtn").addEventListener("click", toggleTorch);
$("againBtn").addEventListener("click", async ()=>{
  cart = []; updateCart(); await startScanner();
});
$("payMoneyBtn").addEventListener("click", startPay);

/* 付錢面板 */
$("moneyGrid").addEventListener("click", ev=>{
  const b = ev.target.closest("button[data-m]");
  if(b) addMoney(parseInt(b.dataset.m, 10));
});
$("payUndoBtn").addEventListener("click", undoMoney);
$("payDoneBtn").addEventListener("click", finishPay);

/* 籃子(移除商品) */
$("cartPill").addEventListener("click", openCart);
$("cartClose").addEventListener("click", closeCart);
$("cartList").addEventListener("click", ev=>{
  const b = ev.target.closest("button[data-code]");
  if(b) removeOne(b.dataset.code);
});

/* 音效 / 語音開關 */
function refreshSettingUI(){
  $("toggleSound").classList.toggle("off", !settings.sound);
  $("toggleVoice").classList.toggle("off", !settings.voice);
  $("toggleSound").textContent = settings.sound ? "🔊 音效" : "🔇 音效";
  $("toggleVoice").textContent = settings.voice ? "🗣️ 語音" : "🤫 語音";
}
$("toggleSound").addEventListener("click", ()=>{
  settings.sound = !settings.sound; saveSettings(); refreshSettingUI();
  if(settings.sound) beep(900,.08);
});
$("toggleVoice").addEventListener("click", ()=>{
  settings.voice = !settings.voice; saveSettings(); refreshSettingUI();
  if(settings.voice) speak("語音打開囉");
});

loadSettings();
refreshSettingUI();
initDb();
loadCards();
</script>
